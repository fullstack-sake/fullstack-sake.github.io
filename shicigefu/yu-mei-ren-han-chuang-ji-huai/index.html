controls="nav-screen" data-v-84e02ed1 data-v-f00b45b2><span class="container" data-v-f00b45b2><span class="top" data-v-f00b45b2></span><span class="middle" data-v-f00b45b2></span><span class="bottom" data-v-f00b45b2></span></span></button></div></div></div></div><div class="divider" data-v-84e02ed1><div class="divider-line" data-v-84e02ed1></div></div></div><!----></header><main id="VPContent" class="poetry-shell__main" vp-content><div class="poem-head"><a class="route-link poem-back" href="/shicigefu/ci/">← 词</a><p class="poem-meta"><span>诗</span><time>2024 年 10 月 14 日</time></p></div><h1 class="poem-title">《虞美人 · 寒窗寄怀》</h1><div class="poetry-content" vp-content><div style="text-align:center;"><p>霜风叩牖冰弦颤，砚底梅花乱。</p><p>青衫尘满未成章，忍看枯枝垂泪向空廊。</p><p>浮生总被寒更误，鬓雪添新絮。</p><p>但求星火暖苍垠，肯借一襟春色破迷津。</p></div></div><nav class="poem-pager" aria-label="同一辑中的其他作品"><a class="route-link pager-item" href="/shicigefu/evening-cicada-old-pavilion-autumn-thoughts/"><span class="pager-label">上一篇</span><span class="pager-title">《一剪梅 · 暮蛩声咽旧苑楼》</span></a><a class="route-link pager-item pager-next" href="/shicigefu/winter-night-homesickness/"><span class="pager-label">下一篇</span><span class="pager-title">《相见欢 · 岁杪归思》</span></a></nav></main><button type="button" class="vp-back-to-top" aria-label="back to top" style="display:none;" data-v-bcf8d9a6><span class="percent" data-allow-mismatch data-v-bcf8d9a6>0%</span><span class="show icon vpi-back-to-top" data-v-bcf8d9a6></span><svg aria-hidden="true" data-v-bcf8d9a6><circle cx="50%" cy="50%" data-allow-mismatch style="stroke-dasharray:calc(0% - 12.566370614359172px) calc(314.1592653589793% - 12.566370614359172px);" data-v-bcf8d9a6></circle></svg></button></div><!--[--><!--]--><!--]--></div><script type="module" src="/assets/app-DT0xjDQq.js" defer></script></body></html>
